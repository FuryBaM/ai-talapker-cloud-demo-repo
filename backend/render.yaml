services:
  - type: web
    name: ai-talapker-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
      - key: APP_CONFIG_FILE
        value: configs/app.cloud.yaml
      - key: APP_USE_EXISTING_QDRANT_INDEX
        value: "1"
      - key: APP_DISABLE_LOCAL_MODEL_LOAD
        value: "1"
      - key: LLM_PROVIDER
        value: openrouter
      - key: APP_GENERATION_BACKEND
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: payload
      - key: APP_EMBEDDING_BACKEND
        value: payload
      - key: OPENROUTER_CHAT_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: QDRANT_COLLECTION
        value: ai_talapker_fastembed_384
      - key: OPENROUTER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        sync: false
