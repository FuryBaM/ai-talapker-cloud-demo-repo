server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /admin.html =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        default_type application/javascript;
        try_files /config.js =404;
    }

    location /static/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }
}
